<script>
/* Carrega os dados com um carimbo de tempo na URL: o arquivo tem sempre o mesmo
   nome, e sem isso o navegador serviria a versao guardada apos uma atualizacao. */
document.write('<scr' + 'ipt src="dados_bi.js?t=' + Date.now() + '"><\/scr' + 'ipt>');
</script>
<script>
"use strict";
(function(){

const D = window.DADOS_BI;
if(!D){ document.getElementById("conteudo").innerHTML =
  '<div class="vazio-aviso">Não encontrei <code>dados_bi.js</code>.<br>Rode <b>ATUALIZAR_BI_OPERACOES.bat</b> para gerar os dados.</div>';
  return; }

const CORES   = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const FUNIL_C = ["--f1","--f2","--f3","--f4","--f5"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* Rótulos amigáveis para os status canônicos. */
const ROT = {
  "CADASTRO":"Cadastro",
  "ANALISE DE CREDITO":"Análise de crédito",
  "COMITE":"Comitê",
  "APROVACAO":"Aprovação",
  "ASSINATURA DE CONTRATO":"Assinatura de contrato",
  "APROVADO":"Aprovado",
  "REPROVADO":"Reprovado"
};

/* A aba METAS guarda o nome do gerente em caixa alta e sem acento ("JOAO PULLIG"),
   enquanto as operações trazem "João Pullig". Em vez de um mapa fixo — que
   envelhece a cada troca de equipe — acho o gerente comparando o nome normalizado. */
const semAcento = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim();

function gerenteDaMeta(nomeMeta){
  const alvo = semAcento(nomeMeta);
  const nomes = [...new Set(OPS.map(o=>o.gerente))];
  return nomes.find(g => semAcento(g) === alvo) || null;
}

/* ---------- formatação ---------- */
const fmtBRL = v => v==null ? "—" : "R$ " + Math.round(v).toLocaleString("pt-BR");
const fmtCurto = v => {
  if(v==null) return "—";
  const a = Math.abs(v);
  if(a >= 1e9) return "R$ " + (v/1e9).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " bi";
  if(a >= 1e6) return "R$ " + (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi";
  if(a >= 1e3) return "R$ " + (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return "R$ " + Math.round(v).toLocaleString("pt-BR");
};
const fmtPct = (n,d) => !d ? "—" : (100*n/d).toLocaleString("pt-BR",{maximumFractionDigits:1}) + "%";

/* Valores em MILHARES, como a diretoria lê: R$ 144.364.000 vira "R$ 144.364 M".
   Mantém a precisão até o milhar (o que "R$ 144,4 mi" perderia) sem encher a
   tela com centena, dezena e unidade, que não mudam decisão nenhuma.
   Usado nos cartões da Visão geral e nas colunas de valor da tabela. */
const fmtPleno = v => {
  if(v == null) return "—";
  if(v === 0) return "R$ 0 M";
  const milhares = Math.round(v / 1000);
  /* Abaixo de R$ 500 o arredondamento zeraria o valor: mostra o número cheio
     para não sumir com um dado que existe. */
  if(milhares === 0) return "R$ " + Math.round(v).toLocaleString("pt-BR");
  return "R$ " + milhares.toLocaleString("pt-BR") + " M";
};
const fmtData = iso => { if(!iso) return "—"; const [a,m,d]=iso.split("-"); return `${d}/${m}/${a}`; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const hoje = new Date();
const diasDesde = iso => iso ? Math.floor((hoje - new Date(iso+"T00:00:00"))/864e5) : null;

/* ---------- estado ----------
   Cada filtro é um conjunto. Conjunto vazio significa "todos" — assim o
   painel abre mostrando tudo, sem precisar marcar 12 caixas. */
const est = {
  aba: "geral",
  gerente: new Set(), status: new Set(), instituicao: new Set(), operacao: new Set(),
  fluxo: new Set(),
  busca: "", historico: false,
  pagina: 1, ordCol: "valor", ordDir: -1,
  /* gráfico mensal Receita × Meta: quais gerentes e quais séries mostrar */
  mensalGer: new Set(), mensalMeta: true, mensalReal: true
};

/* Definição dos cinco filtros de múltipla escolha. FLUXO é a coluna K das
   abas dos gerentes (Não enviado, Pré-análise, Enviado...); linha com o campo
   em branco entra como "(não informado)" para continuar filtrável. */
const CAMPOS = [
  {id:"gerente",     rot:"Gerente",           campo:o=>o.gerente},
  {id:"status",      rot:"Status",            campo:o=>o.status,      rotular:v=>ROT[v]||v},
  {id:"instituicao", rot:"Instituição",       campo:o=>o.instituicao},
  {id:"operacao",    rot:"Tipo de operação",  campo:o=>o.operacao},
  {id:"fluxo",       rot:"Fluxo",             campo:o=>o.fluxo || "(não informado)"}
];

/* Operação sem instituição não é operação sem importância: ela tem volume e
   precisa aparecer nos filtros e no ranking. Recebe rótulo próprio na entrada,
   assim todo o painel a trata como qualquer outro parceiro. */
const SEM_INST = "NÃO ATRIBUÍDO";
const OPS = D.operacoes.map(o =>
  (o.instituicao && String(o.instituicao).trim())
    ? o
    : Object.assign({}, o, { instituicao: SEM_INST, semInstituicao: true }));

function filtrar(){
  const b = est.busca.trim().toLowerCase();
  return OPS.filter(o => {
    if(!est.historico && o.historico) return false;
    for(const c of CAMPOS){
      const sel = est[c.id];
      if(sel.size && !sel.has(c.campo(o))) return false;
    }
    if(b && !(o.cliente.toLowerCase().includes(b) || (o.obs||"").toLowerCase().includes(b))) return false;
    return true;
  });
}

/* Opções de um campo, com a contagem que cada uma traria — a contagem
   respeita os OUTROS filtros ativos, para o número não mentir. */
function opcoesDe(c){
  const b = est.busca.trim().toLowerCase();
  const base = OPS.filter(o => {
    if(!est.historico && o.historico) return false;
    for(const outro of CAMPOS){
      if(outro.id === c.id) continue;
      const sel = est[outro.id];
      if(sel.size && !sel.has(outro.campo(o))) return false;
    }
    if(b && !(o.cliente.toLowerCase().includes(b) || (o.obs||"").toLowerCase().includes(b))) return false;
    return true;
  });
  const cont = new Map();
  base.forEach(o => { const v = c.campo(o); if(v) cont.set(v, (cont.get(v)||0)+1); });
  /* Opções já marcadas continuam na lista mesmo com zero, senão o usuário
     não consegue desmarcar o que acabou de marcar. */
  est[c.id].forEach(v => { if(!cont.has(v)) cont.set(v, 0); });
  return [...cont.entries()].sort((a,b2) => b2[1]-a[1] || a[0].localeCompare(b2[0],"pt-BR"));
}

/* Volume desduplicado: o mesmo negócio ofertado a N instituições vira N linhas. */
const somaValor   = ops => ops.filter(o=>o.unico).reduce((s,o)=>s+(o.valor||0),0);
const somaLinhas  = ops => ops.reduce((s,o)=>s+(o.valor||0),0);
const somaReceita = ops => ops.reduce((s,o)=>s+(o.receita||0),0);
const negocios    = ops => ops.filter(o=>o.unico).length;

/* ---------- tooltip ---------- */
const dica = document.getElementById("dica");
function ligarDica(el, html){
  el.addEventListener("mouseenter", e => { dica.innerHTML = html; dica.style.opacity = "1"; mover(e); });
  el.addEventListener("mousemove", mover);
  el.addEventListener("mouseleave", () => { dica.style.opacity = "0"; });
}
function mover(e){
  const r = dica.getBoundingClientRect();
  let x = e.clientX + 15, y = e.clientY + 15;
  if(x + r.width  > innerWidth  - 10) x = e.clientX - r.width  - 15;
  if(y + r.height > innerHeight - 10) y = e.clientY - r.height - 15;
  dica.style.left = x + "px"; dica.style.top = y + "px";
}

/* ---------- componente: barras horizontais ---------- */
function barras(itens, opc){
  opc = opc || {};
  if(!itens.length) return '<div class="vazio-aviso">Nada a exibir com estes filtros.</div>';
  const max = Math.max(...itens.map(i=>i.valor), 1);
  const div = document.createElement("div");
  div.className = "barras";
  /* Uma medida = uma cor. Só quem passa cor explícita (séries de verdade,
     como meta x realizado) foge do slot 1 — colorir cada barra de um jeito
     não acrescenta informação, o rótulo já identifica a linha. */
  itens.forEach((it,i) => {
    const cor = it.cor || css("--s1");
    const l = document.createElement("div");
    l.className = "linha-b";
    l.innerHTML =
      `<div class="rot" title="${esc(it.rotulo)}">${esc(it.rotulo)}</div>`+
      `<div class="trilha"><div class="barra" style="width:${(100*it.valor/max).toFixed(2)}%;background:${cor}"></div></div>`+
      `<div class="num">${opc.fmt ? opc.fmt(it.valor) : fmtCurto(it.valor)}`+
        (it.pe ? `<small>${esc(it.pe)}</small>` : "")+`</div>`;
    if(it.dica) ligarDica(l, it.dica);
    div.appendChild(l);
  });
  return div.outerHTML;
}

/* ---------- ABA: visão geral ---------- */
function abaGeral(ops){
  const emAndamento = ops.filter(o => D.etapasFunil.includes(o.status));
  const aprovados   = ops.filter(o => o.status === "APROVADO");
  const reprovados  = ops.filter(o => o.status === "REPROVADO");
  const semStatus   = ops.filter(o => !o.status);

  const volAndamento = somaValor(emAndamento);
  const volAprovado  = somaValor(aprovados);
  const recPotencial = somaReceita(emAndamento);
  const recAprovada  = somaReceita(aprovados);

  /* Cartões com o valor por extenso (fmtPleno): "R$ 92,9 mi" arredonda demais
     para um número que a diretoria compara com a planilha. */
  const kpis = [
    { rot:"Volume em negociação", val:fmtPleno(volAndamento),
      pe:`${negocios(emAndamento)} negócios em andamento` },
    { rot:"Volume aprovado", val:fmtPleno(volAprovado),
      pe:`${negocios(aprovados)} negócios aprovados` },
    { rot:"Receita potencial", val:fmtPleno(recPotencial),
      pe:"se tudo em andamento fechar" },
    { rot:"Receita aprovada", val:fmtPleno(recAprovada),
      pe:"operações já com status Aprovado" },
    { rot:"Taxa de aprovação", val:fmtPct(aprovados.length, aprovados.length+reprovados.length),
      pe:`${aprovados.length} aprovadas · ${reprovados.length} reprovadas`,
      alerta:(aprovados.length+reprovados.length)===0 }
  ];

  const classeVal = v => v.length > 15 ? " longo" : (v.length > 12 ? " medio" : "");
  let h = '<div class="grid kpis">' + kpis.map(k =>
    `<div class="kpi${k.alerta?" alerta":""}"><div class="rot">${k.rot}</div>`+
    `<div class="val${classeVal(String(k.val))}">${k.val}</div>`+
    `<div class="pe">${esc(k.pe)}</div></div>`).join("") + '</div>';

  if(semStatus.length){
    h += `<div class="nota" style="margin-bottom:18px"><h3>${semStatus.length} operações sem status preenchido</h3>`+
         `<p>Elas entram nos totais de volume, mas ficam fora do funil e da taxa de aprovação — `+
         `não dá para saber em que etapa estão. Veja a aba <b>Notas</b>.</p></div>`;
  }

  h += '<div class="grid duas">';

  /* funil */
  h += '<div class="painel"><h2>Funil — onde as operações estão paradas</h2>'+
       '<p class="desc">Volume e quantidade por etapa. A seta mostra quanto passa de uma etapa para a seguinte.</p>'+
       funil(ops) + '</div>';

  /* ranking de gerentes */
  const porGer = agrupar(ops, o=>o.gerente);
  const itensGer = [...porGer.entries()]
    .map(([g,lista]) => ({
      rotulo:g, valor:somaValor(lista),
      pe:`${negocios(lista)} negócios`,
      dica:`<b>${esc(g)}</b><br><span class="l">Volume:</span> ${fmtBRL(somaValor(lista))}`+
           `<br><span class="l">Negócios:</span> ${negocios(lista)}`+
           `<br><span class="l">Receita:</span> ${somaReceita(lista) ? fmtBRL(somaReceita(lista)) : "sem dado de fee"}`
    }))
    .sort((a,b)=>b.valor-a.valor);
  h += '<div class="painel"><h2>Volume por gerente</h2>'+
       '<p class="desc">Soma dos negócios únicos — a mesma operação ofertada a várias instituições conta uma vez.</p>'+
       barras(itensGer) + '</div>';

  /* instituições */
  const porInst = agrupar(ops.filter(o=>o.instituicao), o=>o.instituicao);
  const itensInst = [...porInst.entries()]
    .map(([n,lista]) => ({ rotulo:n, valor:somaLinhas(lista), pe:`${lista.length} operações`,
      dica:`<b>${esc(n)}</b><br><span class="l">Volume ofertado:</span> ${fmtBRL(somaLinhas(lista))}<br><span class="l">Operações:</span> ${lista.length}` }))
    .sort((a,b)=>b.valor-a.valor).slice(0,10);
  h += '<div class="painel"><h2>Concentração por instituição</h2>'+
       '<p class="desc">Top 10 por volume ofertado. Aqui a mesma operação conta em cada instituição a que foi enviada — é isso que mede a exposição a cada parceiro.</p>'+
       barras(itensInst) + '</div>';

  /* tipo de operação */
  const porOp = agrupar(ops.filter(o=>o.operacao), o=>o.operacao);
  const itensOp = [...porOp.entries()]
    .map(([n,lista]) => ({ rotulo:n, valor:somaValor(lista), pe:`${negocios(lista)} negócios`,
      dica:`<b>${esc(n)}</b><br><span class="l">Volume:</span> ${fmtBRL(somaValor(lista))}<br><span class="l">Negócios:</span> ${negocios(lista)}` }))
    .sort((a,b)=>b.valor-a.valor);
  h += '<div class="painel"><h2>Tipo de operação</h2>'+
       '<p class="desc">Grafias diferentes do mesmo produto foram unificadas.</p>'+
       barras(itensOp) + '</div>';

  h += '</div>';
  return h;
}

function agrupar(lista, chave){
  const m = new Map();
  lista.forEach(o => { const k = chave(o); if(!m.has(k)) m.set(k,[]); m.get(k).push(o); });
  return m;
}

/* ---------- funil ---------- */
function funil(ops){
  const etapas = D.etapasFunil.map((s,i) => {
    const lista = ops.filter(o => o.status === s);
    return { status:s, rot:ROT[s]||s, lista, valor:somaValor(lista), qtd:negocios(lista),
             cor:css(FUNIL_C[i]) };
  });
  const maxV = Math.max(...etapas.map(e=>e.valor), 1);

  let h = '<div class="funil">';
  etapas.forEach((e,i) => {
    h += `<div class="etapa" data-et="${i}">`+
         `<div class="fundo" style="width:${(100*e.valor/maxV).toFixed(2)}%;background:${e.cor}"></div>`+
         `<div class="esq"><div class="nome">${e.rot}</div>`+
         `<div class="qtd">${e.qtd} ${e.qtd===1?"negócio":"negócios"}</div></div>`+
         `<div class="dir"><div class="v">${fmtCurto(e.valor)}</div></div></div>`;
    if(i < etapas.length-1){
      const prox = etapas[i+1];
      const taxa = e.qtd ? fmtPct(prox.qtd, e.qtd) : "—";
      h += `<div class="seta">↓ passam para a próxima: <b>${taxa}</b></div>`;
    }
  });
  h += '</div>';

  const apr = ops.filter(o=>o.status==="APROVADO");
  const rep = ops.filter(o=>o.status==="REPROVADO");
  h += '<div class="desfechos">'+
    `<div class="desfecho"><div class="cab"><span class="ico" style="background:${css("--good")}">✓</span>Aprovado</div>`+
    `<div class="v">${fmtCurto(somaValor(apr))}</div><div class="p">${negocios(apr)} negócios · ${fmtPct(apr.length, apr.length+rep.length)} dos desfechos</div></div>`+
    `<div class="desfecho"><div class="cab"><span class="ico" style="background:${css("--critical")};color:#fff">✕</span>Reprovado</div>`+
    `<div class="v">${fmtCurto(somaValor(rep))}</div><div class="p">${negocios(rep)} negócios · ${fmtPct(rep.length, apr.length+rep.length)} dos desfechos</div></div>`+
  '</div>';
  return h;
}

/* ---------- ABA: funil detalhado ---------- */
function abaFunil(ops){
  let h = '<div class="painel" style="margin-bottom:16px"><h2>Funil consolidado</h2>'+
          '<p class="desc">Todas as operações filtradas, etapa a etapa.</p>'+ funil(ops) +'</div>';

  /* parados há muito tempo */
  const parados = ops
    .filter(o => D.etapasFunil.includes(o.status) && o.data)
    .map(o => ({o, d:diasDesde(o.data)}))
    .filter(x => x.d != null && x.d > 15)
    .sort((a,b)=>b.d-a.d);

  h += '<div class="painel"><h2>Operações sem movimento</h2>'+
       '<p class="desc">Em andamento e com a data de atualização há mais de 15 dias. Quanto mais no topo, mais tempo parada.</p>';
  if(!parados.length){
    h += '<div class="vazio-aviso">Nenhuma operação em andamento parada há mais de 15 dias.</div>';
  } else {
    h += '<div class="rolagem"><table><thead><tr>'+
         '<th>Cliente</th><th>Gerente</th><th>Etapa</th><th>Instituição</th>'+
         '<th class="n">Valor</th><th class="n">Parada há</th><th>Observação</th>'+
         '</tr></thead><tbody>';
    parados.slice(0,60).forEach(({o,d}) => {
      const cor = d > 60 ? css("--critical") : d > 30 ? css("--warning") : css("--muted");
      h += `<tr><td class="forte">${esc(o.cliente)}${o.historico?'<span class="hist-mark">hist</span>':""}</td>`+
           `<td>${esc(o.gerente)}</td><td>${esc(ROT[o.status]||o.status)}</td>`+
           `<td>${o.instituicao?esc(o.instituicao):'<span class="vazio-cel">—</span>'}</td>`+
           `<td class="n">${o.valor?fmtPleno(o.valor):'<span class="vazio-cel">—</span>'}</td>`+
           `<td class="n" style="color:${cor};font-weight:600">${d} dias</td>`+
           `<td style="max-width:280px">${o.obs?esc(o.obs):'<span class="vazio-cel">—</span>'}</td></tr>`;
    });
    h += '</tbody></table></div>';
    if(parados.length > 60) h += `<div class="paginacao">mostrando 60 de ${parados.length}</div>`;
  }
  h += '</div>';
  return h;
}

/* ---------- ABA: gerentes ---------- */
function abaGerentes(ops){
  const porGer = agrupar(ops, o=>o.gerente);
  const linhas = [...porGer.entries()].map(([g,lista]) => {
    const apr = lista.filter(o=>o.status==="APROVADO");
    const rep = lista.filter(o=>o.status==="REPROVADO");
    const and = lista.filter(o=>D.etapasFunil.includes(o.status));
    /* O gerador escreve total/comFee; arquivos antigos traziam linhas/comReceita.
       Aceito os dois para o painel nao depender da versao do dados_bi.js. */
    const cob = D.cobertura[g] || {};
    const comFee = (cob.comFee != null) ? cob.comFee : cob.comReceita;
    return {
      gerente:g, historico:lista[0].historico,
      negocios:negocios(lista), linhas:lista.length,
      volume:somaValor(lista), volAndamento:somaValor(and), volAprovado:somaValor(apr),
      receita:somaReceita(lista),
      semFee: comFee === 0,
      apr:apr.length, rep:rep.length,
      taxa: (apr.length+rep.length) ? apr.length/(apr.length+rep.length) : null
    };
  }).sort((a,b)=>b.volume-a.volume);

  let h = '<div class="painel" style="margin-bottom:16px"><h2>Comparativo de gerentes</h2>'+
    '<p class="desc">Clique no cabeçalho para reordenar. "Negócios" desconta a mesma operação enviada a várias instituições; "linhas" é o total bruto da planilha.</p>'+
    '<div class="rolagem"><table><thead><tr>'+
    '<th>Gerente</th><th class="n">Negócios</th><th class="n">Linhas</th>'+
    '<th class="n">Volume total</th><th class="n">Em andamento</th><th class="n">Aprovado</th>'+
    '<th class="n">Receita</th><th class="n">Aprov.</th><th class="n">Reprov.</th><th class="n">Taxa</th>'+
    '</tr></thead><tbody>';
  linhas.forEach(l => {
    h += `<tr><td class="forte">${esc(l.gerente)}</td>`+
      `<td class="n">${l.negocios}</td><td class="n" style="color:var(--muted)">${l.linhas}</td>`+
      `<td class="n">${fmtCurto(l.volume)}</td><td class="n">${fmtCurto(l.volAndamento)}</td>`+
      `<td class="n">${fmtCurto(l.volAprovado)}</td>`+
      `<td class="n">${l.semFee ? '<span class="sem-dado">sem dado de fee</span>' : fmtCurto(l.receita)}</td>`+
      `<td class="n" style="color:${css("--good")}">${l.apr}</td>`+
      `<td class="n" style="color:${css("--critical")}">${l.rep}</td>`+
      `<td class="n">${l.taxa==null ? '<span class="vazio-cel">—</span>' : (100*l.taxa).toFixed(0)+"%"}</td></tr>`;
  });
  h += '</tbody></table></div></div>';

  /* receita x meta */
  h += secaoMetas(ops);
  /* e o mesmo comparativo aberto mes a mes */
  h += secaoMensal(ops);
  return h;
}

/* ---------- gráfico mensal: Receita × Meta por gerente ---------- */

/* Receita aprovada por gerente e mês. Usa SÓ a DATA FECHAMENTO: é ela que diz
   quando o negócio entrou de fato. A coluna Atualização registra a última
   mexida na linha e jogaria a receita no mês errado. */
function receitaMensalPorGerente(ops){
  const mapa = {};
  ops.forEach(o => {
    if(o.status !== "APROVADO" || !o.receita || !o.dataFechamento) return;
    const mes = parseInt(o.dataFechamento.slice(5,7), 10) - 1;
    if(isNaN(mes) || mes < 0 || mes > 11) return;
    (mapa[o.gerente] = mapa[o.gerente] || new Array(12).fill(0))[mes] += o.receita;
  });
  return mapa;
}

/* Meta mensal por gerente, casando o nome da aba METAS com o das operações. */
function metaMensalPorGerente(){
  const mapa = {};
  Object.keys(D.metas || {}).forEach(nm => {
    const g = gerenteDaMeta(nm);
    const m = (D.metas[nm] || {}).meta;
    if(g && Array.isArray(m)) mapa[g] = m.map(v => v || 0);
  });
  return mapa;
}

function secaoMensal(ops){
  const metas    = metaMensalPorGerente();
  const realizado = receitaMensalPorGerente(ops);

  /* Entram no gráfico os gerentes com meta ou com receita lançada. */
  const candidatos = [...new Set([...Object.keys(metas), ...Object.keys(realizado)])].sort(
    (a,b) => a.localeCompare(b,"pt-BR"));

  let h = '<div class="painel gmensal"><h2>Receita × meta mês a mês</h2>'+
    '<p class="desc">Compara o que cada gerente trouxe em cada mês com a meta daquele mês. '+
    'A meta aparece tracejada e o realizado em linha cheia, na cor do gerente.</p>';

  if(!candidatos.length){
    return h + '<div class="vazio-aviso">Nenhum gerente com meta cadastrada ou receita lançada.</div></div>';
  }

  /* Primeira vez: mostra todo mundo. */
  if(!est.mensalGer.size) candidatos.forEach(g => est.mensalGer.add(g));
  const sel = candidatos.filter(g => est.mensalGer.has(g));

  const cor = g => css(CORES[candidatos.indexOf(g) % CORES.length]);

  /* ---- controles ---- */
  h += '<div class="ctrl">'+
    '<div class="campo"><label>Gerentes no gráfico</label>'+
    `<div class="multi" data-campo="mensalGer">`+
      `<button type="button" class="multi-btn">`+
      (sel.length === candidatos.length ? "Todos"
        : sel.length === 1 ? esc(sel[0])
        : sel.length ? `${sel.length} selecionados` : "Nenhum")+
      `<span class="cae">▼</span></button>`+
      `<div class="multi-pop oculto"><div class="multi-lista">`+
      candidatos.map(g =>
        `<label class="opc"><input type="checkbox" data-ger="${esc(g)}"`+
        `${est.mensalGer.has(g)?" checked":""}><span style="border-left:3px solid ${cor(g)};padding-left:7px">`+
        `${esc(g)}</span></label>`).join("")+
      `</div></div>`+
    '</div></div>'+
    '<div class="series">'+
      `<button type="button" data-serie="meta" aria-pressed="${est.mensalMeta}">`+
        `<span class="amostra" style="border-top-style:dashed;border-top-color:var(--muted)"></span>Meta</button>`+
      `<button type="button" data-serie="real" aria-pressed="${est.mensalReal}">`+
        `<span class="amostra" style="border-top-color:var(--gold)"></span>Realizado</button>`+
    '</div>'+
  '</div>';

  /* ---- séries a desenhar ---- */
  const series = [];
  sel.forEach(g => {
    if(est.mensalMeta && metas[g])     series.push({ger:g, tipo:"meta", vals:metas[g],     cor:cor(g)});
    if(est.mensalReal)                 series.push({ger:g, tipo:"real", vals:realizado[g] || new Array(12).fill(0), cor:cor(g)});
  });

  h += '<div id="gmensal-plot">' + desenhoMensal(ops, sel, series, cor) + '</div>';
  return h + '</div>';
}

/* O tooltip do painel funciona por listener em cada elemento, então os pontos
   do SVG precisam ser ligados depois de desenhados (a cada redesenho). */
function ligarDicasMensal(){
  document.querySelectorAll("#gmensal-plot circle.ponto[data-dica]").forEach(c => {
    ligarDica(c, c.dataset.dica);
  });
}

/* Redesenha apenas o gráfico, preservando os controles como estão — inclusive
   a lista de gerentes aberta, para dar conta de marcar vários de uma vez. */
function redesenharMensal(){
  const alvo = document.getElementById("gmensal-plot");
  if(!alvo) return;
  const ops = filtrar();
  const metas = metaMensalPorGerente();
  const real  = receitaMensalPorGerente(ops);
  const cands = [...new Set([...Object.keys(metas), ...Object.keys(real)])].sort(
    (a,b) => a.localeCompare(b,"pt-BR"));
  const sel = cands.filter(g => est.mensalGer.has(g));
  const cor = g => css(CORES[cands.indexOf(g) % CORES.length]);
  const series = [];
  sel.forEach(g => {
    if(est.mensalMeta && metas[g]) series.push({ger:g, tipo:"meta", vals:metas[g], cor:cor(g)});
    if(est.mensalReal)             series.push({ger:g, tipo:"real", vals:real[g] || new Array(12).fill(0), cor:cor(g)});
  });
  alvo.innerHTML = desenhoMensal(ops, sel, series, cor);
  ligarDicasMensal();
  /* o rótulo do seletor acompanha a escolha, sem recriar a lista */
  const btn = document.querySelector('.multi[data-campo="mensalGer"] .multi-btn');
  if(btn) btn.innerHTML = (sel.length === cands.length ? "Todos"
      : sel.length === 1 ? esc(sel[0])
      : sel.length ? sel.length + " selecionados" : "Nenhum") + '<span class="cae">▼</span>';
}

/* Só o desenho: SVG, legenda e aviso. Fica separado dos controles para que
   marcar um gerente redesenhe o gráfico sem recriar (e fechar) a lista. */
function desenhoMensal(ops, sel, series, cor){
  let h = "";
  if(!series.length){
    return '<div class="vazio-aviso">Escolha ao menos um gerente e uma das séries.</div>';
  }

  /* recalcula aqui para a função não depender do escopo de quem a chamou */
  const temReceita = Object.keys(receitaMensalPorGerente(ops)).length > 0;
  const maximo = Math.max(1, ...series.flatMap(s => s.vals));

  /* ---- geometria ---- */
  const L = 1000, A = 300, mE = 78, mD = 16, mT = 14, mB = 34;
  const px = i => mE + (i * (L - mE - mD)) / 11;
  const py = v => A - mB - (v / maximo) * (A - mT - mB);

  let g = `<svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Receita e meta mês a mês">`;

  /* grade e rótulos do eixo vertical */
  for(let k = 0; k <= 4; k++){
    const v = (maximo * k) / 4, y = py(v);
    g += `<line class="grade" x1="${mE}" y1="${y}" x2="${L - mD}" y2="${y}"/>`+
         `<text class="rotEixo" x="${mE - 9}" y="${y + 3.5}" text-anchor="end">${fmtPleno(v)}</text>`;
  }
  g += `<line class="eixo" x1="${mE}" y1="${mT}" x2="${mE}" y2="${A - mB}"/>`+
       `<line class="eixo" x1="${mE}" y1="${A - mB}" x2="${L - mD}" y2="${A - mB}"/>`;

  /* meses */
  D.meses.forEach((m, i) => {
    g += `<text class="rotEixo" x="${px(i)}" y="${A - mB + 17}" text-anchor="middle">`+
         `${m.slice(0,3)}</text>`;
  });

  /* linhas: meta tracejada, realizado cheia */
  series.forEach(s => {
    const d = s.vals.map((v,i) => `${i?"L":"M"}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.tipo==="meta"?2:2.6}"`+
         `${s.tipo==="meta"?' stroke-dasharray="6 5" opacity=".75"':''} stroke-linejoin="round"/>`;
    s.vals.forEach((v,i) => {
      g += `<circle class="ponto" cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.6"`+
           ` fill="${s.tipo==="meta"?"var(--surface)":s.cor}" stroke="${s.cor}" stroke-width="2"`+
           ` data-dica="<b>${esc(s.ger)}</b><br>${D.meses[i].toLowerCase()} — `+
           `${s.tipo==="meta"?"meta":"realizado"}<br>${fmtPleno(v)}"/>`;
    });
  });
  g += '</svg>';
  h += g;

  /* ---- legenda ---- */
  h += '<div class="legenda">'+
    sel.map(x => `<span><i style="border-top-color:${cor(x)}"></i>${esc(x)}</span>`).join("")+
    `<span><i style="border-top-style:dashed;border-top-color:var(--muted)"></i>tracejado = meta</span>`+
    '</div>';

  /* ---- aviso quando falta a data de fechamento ---- */
  const semData = ops.filter(o => o.status === "APROVADO" && o.receita && !o.dataFechamento).length;
  if(semData){
    h += `<div class="nota" style="margin:16px 0 0"><h3>${semData} operações aprovadas sem data de fechamento `+
         `<span class="selo">atenção</span></h3>`+
         `<p>A receita delas <b>não aparece em nenhum mês</b> deste gráfico — sem a data não há como `+
         `saber onde lançar. Preencha a coluna <b>DATA FECHAMENTO</b> na planilha ao marcar o status `+
         `como Aprovado. O total do ano na seção acima continua contando todas.</p></div>`;
  } else if(!temReceita){
    h += '<div class="nota" style="margin:16px 0 0"><h3>Nenhuma receita lançada ainda</h3>'+
         '<p>As linhas de realizado ficam no zero até haver operação aprovada com '+
         '<b>data de fechamento</b> preenchida.</p></div>';
  }

  return h;
}

function secaoMetas(ops){
  const nomes = Object.keys(D.metas || {});
  let h = '<div class="painel"><h2>Receita × meta</h2>'+
    '<p class="desc">Meta anual vinda da aba METAS da planilha. O realizado é a receita das operações com status Aprovado.</p>';

  if(!nomes.length){
    h += '<div class="vazio-aviso">Nenhuma meta cadastrada na aba METAS da planilha.</div></div>';
    return h;
  }

  const itens = [];
  nomes.forEach(nm => {
    const m = D.metas[nm] || {};
    /* Campos podem vir ausentes ou nulos conforme a versão da planilha —
       tratar como lista vazia evita derrubar a aba inteira. */
    const metaAno = (m.meta || []).reduce((a,b)=>a+(b||0),0);
    const realPl  = (m.realizadoPlanilha || []).reduce((a,b)=>a+(b||0),0);
    const alvo    = gerenteDaMeta(nm);
    const rot     = alvo || nm;
    const calc = somaReceita(ops.filter(o => o.gerente === alvo && o.status === "APROVADO"));
    itens.push({rotulo:`${rot} — meta`, valor:metaAno, cor:css("--muted"),
      dica:`<b>Meta anual</b><br>${fmtBRL(metaAno)}`});
    itens.push({rotulo:`${rot} — realizado`, valor:calc, cor:css("--s1"),
      pe:fmtPct(calc, metaAno)+" da meta",
      dica:`<b>Realizado</b><br>Receita das operações com status Aprovado.<br>${fmtBRL(calc)}`});
    /* A v3 calcula o realizado por fórmula na própria planilha; só mostro a
       linha "digitada" quando ela existir de fato (planilhas antigas). */
    if(realPl){
      itens.push({rotulo:`${rot} — realizado (planilha)`, valor:realPl, cor:css("--s4"),
        pe:fmtPct(realPl, metaAno)+" da meta",
        dica:`<b>Realizado digitado na planilha</b><br>${fmtBRL(realPl)}`});
    }
  });

  h += barras(itens, {fmt:fmtBRL});
  h += '<div class="legenda">'+
    `<span><i style="background:${css("--muted")}"></i>Meta anual</span>`+
    `<span><i style="background:${css("--s1")}"></i>Realizado calculado pelas operações</span>`+
    `<span><i style="background:${css("--s4")}"></i>Realizado digitado na planilha</span>`+
    '</div>';

  const comMeta = new Set(nomes.map(nm => gerenteDaMeta(nm)).filter(Boolean));
  const semMeta = [...new Set(OPS.filter(o=>!o.historico).map(o=>o.gerente))]
    .filter(g => !comMeta.has(g));
  if(semMeta.length){
    h += `<div class="nota" style="margin:16px 0 0"><h3>${semMeta.length} gerentes sem meta cadastrada</h3>`+
         `<p>${semMeta.map(esc).join(", ")} — aparecem no painel sem barra de meta, `+
         `porque não há meta cadastrada para eles na aba METAS da planilha.</p></div>`;
  }
  h += '</div>';
  return h;
}

/* ---------- ABA: instituições ---------- */
function abaInstituicoes(ops){
  const porInst = agrupar(ops.filter(o=>o.instituicao), o=>o.instituicao);
  const total = somaLinhas(ops.filter(o=>o.instituicao));
  const linhas = [...porInst.entries()].map(([n,lista]) => {
    const apr = lista.filter(o=>o.status==="APROVADO").length;
    const rep = lista.filter(o=>o.status==="REPROVADO").length;
    return { inst:n, ops:lista.length, volume:somaLinhas(lista),
             share: total ? somaLinhas(lista)/total : 0,
             gerentes:new Set(lista.map(o=>o.gerente)).size, apr, rep,
             taxa:(apr+rep)?apr/(apr+rep):null };
  }).sort((a,b)=>b.volume-a.volume);

  let h = '<div class="painel" style="margin-bottom:16px"><h2>Exposição por instituição</h2>'+
    '<p class="desc">Quanto do volume ofertado depende de cada parceiro. "% do total" mostra a concentração — número alto significa dependência de um só parceiro.</p>'+
    '<div class="rolagem"><table><thead><tr>'+
    '<th>Instituição</th><th class="n">Operações</th><th class="n">Volume ofertado</th>'+
    '<th class="n">% do total</th><th class="n">Gerentes</th><th class="n">Aprov.</th>'+
    '<th class="n">Reprov.</th><th class="n">Taxa</th></tr></thead><tbody>';
  linhas.forEach(l => {
    h += `<tr><td class="forte">${esc(l.inst)}</td><td class="n">${l.ops}</td>`+
      `<td class="n">${fmtCurto(l.volume)}</td>`+
      `<td class="n">${(100*l.share).toFixed(1)}%</td>`+
      `<td class="n">${l.gerentes}</td>`+
      `<td class="n" style="color:${css("--good")}">${l.apr}</td>`+
      `<td class="n" style="color:${css("--critical")}">${l.rep}</td>`+
      `<td class="n">${l.taxa==null?'<span class="vazio-cel">—</span>':(100*l.taxa).toFixed(0)+"%"}</td></tr>`;
  });
  h += '</tbody></table></div></div>';

  const semInst = ops.filter(o=>o.semInstituicao).length;
  if(semInst){
    h += `<div class="nota"><h3>${semInst} operações sem instituição preenchida</h3>`+
         `<p>Aparecem agrupadas como <b>${SEM_INST}</b> — entram no ranking e nos totais, `+
         `mas não se sabe de qual parceiro dependem. Preencha a coluna Instituição na `+
         `planilha para elas irem para o parceiro certo.</p></div>`;
  }
  return h;
}

/* ---------- ABA: operações ---------- */
const POR_PAG = 40;
const COLS = [
  {k:"cliente",     r:"Cliente"},
  {k:"gerente",     r:"Gerente"},
  {k:"operacao",    r:"Operação"},
  {k:"valor",       r:"Valor",       n:true},
  {k:"taxa",        r:"Fee",         n:true},
  {k:"receita",     r:"Receita",     n:true},
  {k:"instituicao", r:"Instituição"},
  {k:"status",      r:"Status"},
  {k:"mandato",     r:"Mandato"},
  {k:"data",        r:"Atualização", n:true},
  {k:"obs",         r:"Observação"}
];
const COR_STATUS = {
  "CADASTRO":"--f2","ANALISE DE CREDITO":"--f3","COMITE":"--f4",
  "APROVACAO":"--f5","ASSINATURA DE CONTRATO":"--s7",
  "APROVADO":"--good","REPROVADO":"--critical"
};

function abaOperacoes(ops){
  const arr = ops.slice().sort((a,b)=>{
    let x=a[est.ordCol], y=b[est.ordCol];
    if(x==null && y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    if(typeof x === "string") return est.ordDir * x.localeCompare(y,"pt-BR");
    return est.ordDir * (x-y);
  });
  const tot = Math.max(1, Math.ceil(arr.length/POR_PAG));
  if(est.pagina > tot) est.pagina = tot;
  const fatia = arr.slice((est.pagina-1)*POR_PAG, est.pagina*POR_PAG);

  /* Subtotais somam TUDO que está no filtro, não só a página visível — é o
     número que responde "quanto dá o que estou vendo". */
  const totValor   = arr.reduce((a,o)=>a+(o.valor||0), 0);
  const totReceita = arr.reduce((a,o)=>a+(o.receita||0), 0);
  const nValor     = arr.filter(o=>o.valor).length;
  const nReceita   = arr.filter(o=>o.receita).length;

  const subtotal = COLS.map(c => {
    if(c.k === "cliente")
      return `<th><span class="rot">Subtotal — ${arr.length} ${arr.length===1?"operação":"operações"}</span></th>`;
    if(c.k === "valor")
      return `<th class="n"><span class="val">${fmtPleno(totValor)}</span>`+
             (nValor < arr.length ? `<small style="display:block;font-weight:400;color:var(--muted);font-size:10px">${arr.length-nValor} sem valor</small>` : "")+`</th>`;
    if(c.k === "receita")
      return `<th class="n"><span class="val">${fmtPleno(totReceita)}</span>`+
             (nReceita < arr.length ? `<small style="display:block;font-weight:400;color:var(--muted);font-size:10px">${arr.length-nReceita} sem receita</small>` : "")+`</th>`;
    return "<th></th>";
  }).join("");

  let h = '<div class="painel"><h2>Todas as operações</h2>'+
    '<p class="desc">A lista completa por trás dos números. Clique no cabeçalho para ordenar. '+
    'Os subtotais somam todas as operações do filtro, não apenas a página exibida.</p>'+
    '<div class="rolagem fixa"><table><thead>'+
    `<tr class="subtotais">${subtotal}</tr>`+
    '<tr class="titulos">'+
    COLS.map(c => `<th class="${c.n?"n":""}" data-ord="${c.k}">${c.r}`+
      (est.ordCol===c.k ? (est.ordDir<0?" ↓":" ↑") : "")+`</th>`).join("")+
    '</tr></thead><tbody>';

  if(!fatia.length){
    h += `<tr><td colspan="${COLS.length}"><div class="vazio-aviso">Nenhuma operação com estes filtros.</div></td></tr>`;
  }
  fatia.forEach(o => {
    const d = diasDesde(o.data);
    h += "<tr>"+
      `<td class="forte">${esc(o.cliente)}${o.historico?'<span class="hist-mark">hist</span>':""}`+
        (o.dupExata?'<span class="hist-mark" style="color:var(--warning);border-color:var(--warning)" title="Linha repetida: mesmo cliente, valor e instituição">dup</span>':"")+`</td>`+
      `<td>${esc(o.gerente)}</td>`+
      `<td>${o.operacao?esc(o.operacao):'<span class="vazio-cel">—</span>'}</td>`+
      `<td class="n">${o.valor?fmtPleno(o.valor):'<span class="vazio-cel">—</span>'}</td>`+
      `<td class="n">${o.taxa?(100*o.taxa).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%":'<span class="vazio-cel">—</span>'}</td>`+
      `<td class="n">${o.receita?fmtPleno(o.receita):'<span class="vazio-cel">—</span>'}</td>`+
      `<td>${o.instituicao?esc(o.instituicao):'<span class="vazio-cel">—</span>'}</td>`+
      `<td>${o.status?`<span class="tag" style="background:${css(COR_STATUS[o.status]||"--surface-3")}22;color:${css(COR_STATUS[o.status]||"--ink-2")}">${esc(ROT[o.status]||o.status)}</span>`:'<span class="vazio-cel">—</span>'}</td>`+
      `<td>${o.mandato?esc(o.mandato):'<span class="vazio-cel">—</span>'}</td>`+
      `<td class="n" title="${o.data?fmtData(o.data):""}">${o.data?fmtData(o.data):'<span class="vazio-cel">—</span>'}`+
        (d!=null && d>30?`<small style="display:block;color:var(--warning);font-size:10.5px">${d}d parada</small>`:"")+`</td>`+
      `<td style="max-width:260px">${o.obs?esc(o.obs):'<span class="vazio-cel">—</span>'}</td>`+
    "</tr>";
  });
  h += '</tbody></table></div>';
  h += `<div class="paginacao">`+
    `<button data-pag="ant" ${est.pagina<=1?"disabled":""}>← anterior</button>`+
    `<span>página ${est.pagina} de ${tot} — ${arr.length} operações</span>`+
    `<button data-pag="prox" ${est.pagina>=tot?"disabled":""}>próxima →</button></div>`;
  h += '</div>';
  return h;
}

/* ---------- ABA: notas explicativas ---------- */
function abaNotas(){
  /* Painel na v2: a planilha ja nasce padronizada (listas suspensas), entao as
     notas deixaram de falar de grafia e passaram a apontar o que ainda falta
     preencher — que e o que realmente distorce numero hoje. */
  const ativas   = OPS.filter(o=>!o.historico);
  const semValor = ativas.filter(o=>!o.valor);
  const semFee   = ativas.filter(o=>!o.taxa);
  const semStatus= ativas.filter(o=>!o.status);
  const aprov    = ativas.filter(o=>o.status==="APROVADO");
  const semFecha = aprov.filter(o=>!o.dataFechamento);
  const reprov   = ativas.filter(o=>o.status==="REPROVADO");
  const hist     = OPS.filter(o=>o.historico);

  /* gerentes cujas operacoes estao TODAS sem valor: aparecem zerados sem ser culpa deles */
  const porGer = {};
  ativas.forEach(o=>{ (porGer[o.gerente] = porGer[o.gerente] || {t:0,sv:0}); porGer[o.gerente].t++; if(!o.valor) porGer[o.gerente].sv++; });
  const zerados = Object.entries(porGer).filter(([,c])=>c.t>0 && c.sv===c.t).map(([g,c])=>`${g} (${c.t})`);
  const pctSemValor = ativas.length ? Math.round(semValor.length*100/ativas.length) : 0;

  let h = '<div class="nota info"><h3>Como ler este painel <span class="selo">comece aqui</span></h3>'+
    '<p><b>Cada linha da planilha é uma operação, e todas contam.</b> Se o mesmo cliente aparece em três instituições com o mesmo valor, são três operações — foi a regra definida com a diretoria, porque cada uma é uma captação real.</p>'+
    `<p>Hoje o painel mostra <b>${ativas.length} operações ativas</b>. Somar a coluna VALOR da planilha `+
    'dá exatamente o mesmo número que aparece aqui: não há desconto nem agrupamento no meio do caminho.</p>'+
    '<p>Fora dessa conta ficam apenas as linhas do <b>histórico</b> — veja abaixo o que entra lá.</p></div>';

  if(semValor.length){
    h += `<div class="nota"><h3>${semValor.length} operações sem valor preenchido <span class="selo">atenção</span></h3>`+
      `<p>São <b>${pctSemValor}% das operações ativas</b>. Elas têm cliente e status, mas o campo <b>VALOR</b> está vazio — `+
      'então <b>não entram em nenhum total</b>: nem volume, nem receita, nem funil por valor.</p>';
    if(zerados.length){
      h += '<p>Estes gerentes estão com <b>todas</b> as operações nessa situação, e por isso aparecem zerados no painel:<br>'+
           `<b>${zerados.map(esc).join(" · ")}</b></p>`+
           '<p>Não é que não produziram — é campo em branco. Preenchendo o valor na aba do gerente, eles aparecem na próxima atualização.</p>';
    }
    h += '</div>';
  }

  if(semFee.length){
    h += `<div class="nota"><h3>${semFee.length} operações sem fee <span class="selo">limitação de dados</span></h3>`+
      '<p>Entram no <b>volume</b> normalmente, mas ficam fora da <b>receita</b>: sem a alíquota não há como calcular quanto a PJC ganha.</p>'+
      '<p>Na v2 a receita é fórmula (<code>Valor × Fee</code>), então basta preencher o fee na aba do gerente que o número aparece sozinho — aqui e na aba METAS.</p></div>';
  }

  h += '<div class="nota"><h3>Data de fechamento: o campo que faz a meta funcionar <span class="selo">importante</span></h3>'+
    '<p>A coluna <b>ATUALIZAÇÃO</b> registra a última mexida na linha, não quando o negócio fechou. Usá-la para receita mensal jogaria o dinheiro no mês errado.</p>'+
    '<p>Por isso existe a coluna <b>DATA FECHAMENTO</b>: preencha-a ao marcar o status como <b>Aprovado</b>. É ela que alimenta o realizado da aba METAS.</p>';
  if(semFecha.length){
    h += `<p><b>${semFecha.length} operação(ões) aprovada(s) estão sem essa data</b> — a receita delas não entra em mês nenhum. `+
         'A coluna "Aprovado sem data" da aba METAS mostra o valor que está ficando de fora.</p>';
  }
  h += '<p>As datas das operações já aprovadas foram <b>copiadas da coluna Atualização</b> na migração da v1, que não tinha esse campo. Vale conferir — são poucas linhas e é o que faz o mês bater.</p></div>';

  h += `<div class="nota"><h3>O que entra no histórico <span class="selo">decisão</span></h3>`+
    `<p>A aba <b>HISTÓRICO</b> da planilha reúne ${hist.length} linhas de duas origens: as das abas antigas <b>KAIO1</b> e <b>PABLO</b>, e os <b>reprovados</b> de todos os gerentes.</p>`+
    `<p>Uma diferença importante: os <b>${reprov.length} reprovados do ciclo atual continuam contando</b> na taxa de aprovação — `+
    'senão ela mostraria 100%, já que só os aprovados teriam sobrado. Só as linhas das abas antigas ficam de fora dos KPIs.</p>'+
    '<p>Para ver as antigas, marque <b>"Incluir histórico"</b> na barra de filtros; elas aparecem com o selo <span class="hist-mark">hist</span>.</p></div>';

  if(semStatus.length){
    h += `<div class="nota"><h3>${semStatus.length} operações sem status <span class="selo">atenção</span></h3>`+
      '<p>Entram no volume, mas ficam <b>fora do funil e da taxa de aprovação</b> — sem status não dá para saber em que etapa estão.</p></div>';
  }

  h += '<div class="nota"><h3>Itens marcados com asterisco <span class="selo">confirmar</span></h3>'+
    '<p>Na aba <b>PARAMETROS</b> da planilha, alguns parceiros estão no fim da lista com <b>*</b>: '+
    '<code>FIRMA CAPITAL*</code>, <code>DAVOS FIDC*</code>, <code>RNX FIDIC*</code> e <code>BANCO BCG*</code>. '+
    'O asterisco significa que o nome ou a existência ainda precisa de confirmação.</p>'+
    '<p>Confirmado o nome correto, é só apagar o asterisco na aba PARAMETROS — as operações já lançadas continuam válidas.</p></div>';

  h += '<div class="nota ok"><h3>A padronização agora é na origem <span class="selo">v2</span></h3>'+
    '<p>Na versão anterior o painel precisava adivinhar: <code>RNX</code> e <code>RNX FIDIC</code>, <code>SAPIIENS</code> e <code>SAPIENS CAPITAL</code>, <code>CASH ME</code> e <code>CASHME</code> — eram 33 grafias diferentes para os mesmos parceiros.</p>'+
    '<p>Na v2 isso acabou: instituição, tipo de operação, status, fluxo, mandato, parceiro indicador e motivo de recusa são <b>listas suspensas</b>. Quem preenche escolhe, não digita. O painel apenas lê.</p>'+
    '<p>Para incluir um item novo, use a aba <b>PARAMETROS</b> — a lista passa a oferecê-lo em todas as abas na hora.</p></div>';

  h += '<div class="nota info"><h3>Como atualizar <span class="selo">rotina</span></h3>'+
    '<p>Feche esta aba e dê duplo clique no atalho <b>“BI de Operações PJC”</b>. Ele busca a planilha mais recente do OneDrive, recalcula tudo e reabre o painel — leva alguns segundos e <b>não precisa instalar nada</b>.</p>'+
    '<p>Os gerentes editam a planilha pelo navegador, então o que você vê aqui é o que estava lá no momento da última atualização. A planilha nunca é modificada por este painel — é aberta só para leitura.</p>'+
    `<p>Fonte destes dados: <code>${esc(D.arquivoFonte||"")}</code>, lida em <b>${esc((D.geradoEm||"").replace("T"," "))}</b>.</p></div>`;

  return h;
}

/* ---------- abas ---------- */
const ABAS = [
  {id:"geral",  rot:"Visão geral",   fn:abaGeral},
  {id:"funil",  rot:"Funil",         fn:abaFunil},
  {id:"ger",    rot:"Gerentes",      fn:abaGerentes},
  {id:"inst",   rot:"Instituições",  fn:abaInstituicoes},
  {id:"ops",    rot:"Operações",     fn:abaOperacoes},
  {id:"notas",  rot:"Notas",         fn:abaNotas, avisos:true}
];

/* Conta só o que pede ação de alguém — não o total de notas. Assim o número
   no rótulo cai conforme a planilha vai sendo preenchida. */
function contarPendencias(){
  const at = OPS.filter(o=>!o.historico);
  let n = 0;
  if(at.some(o=>!o.valor))  n++;   // operação sem valor lançado
  if(at.some(o=>!o.taxa))   n++;   // sem fee: fica fora da receita
  if(at.some(o=>!o.status)) n++;   // sem status: fora do funil
  if(at.some(o=>o.status==="APROVADO" && !o.dataFechamento)) n++;  // meta não conta
  if(D.instituicoesOficiais && D.instituicoesOficiais.some(i=>i.endsWith("*"))) n++;
  return n;
}

function pintarAbas(){
  const n = contarPendencias();
  document.getElementById("abas").innerHTML = ABAS.map(a =>
    `<button role="tab" data-aba="${a.id}" aria-selected="${est.aba===a.id}">${a.rot}`+
    (a.avisos && n ? `<span class="pino">${n}</span>` : "")+`</button>`).join("");
}

/* Texto do botão: "Todos", o nome quando é um só, ou a contagem. */
function rotuloBotao(c){
  const sel = est[c.id];
  if(!sel.size) return `<span class="txt todos">Todos</span>`;
  if(sel.size === 1){
    const v = [...sel][0];
    return `<span class="txt">${esc(c.rotular ? c.rotular(v) : v)}</span>`;
  }
  return `<span class="txt">${c.rot}</span><span class="cha">${sel.size}</span>`;
}

function pintarMultiLista(c, filtro){
  const f = (filtro||"").trim().toLowerCase();
  const opts = opcoesDe(c).filter(([v]) =>
    !f || String(c.rotular ? c.rotular(v) : v).toLowerCase().includes(f));
  if(!opts.length) return '<div class="nada">Nenhuma opção encontrada.</div>';
  return opts.map(([v,n]) =>
    `<label><input type="checkbox" value="${esc(v)}"${est[c.id].has(v)?" checked":""}>`+
    `<span class="nm">${esc(c.rotular ? c.rotular(v) : v)}</span>`+
    `<span class="cnt">${n}</span></label>`).join("");
}

function pintarFiltros(){
  const campos = CAMPOS.map(c =>
    `<div class="campo"><label>${c.rot}</label>`+
    `<div class="multi" data-campo="${c.id}">`+
      `<button type="button" class="multi-btn">${rotuloBotao(c)}<span class="cae">▼</span></button>`+
      `<div class="multi-pop oculto">`+
        `<div class="topo">`+
          `<input type="search" class="multi-busca" placeholder="filtrar ${c.rot.toLowerCase()}…">`+
          `<div class="acoes"><button type="button" data-acao="todos">Marcar todos</button>`+
          `<button type="button" data-acao="nenhum">Limpar</button></div>`+
        `</div>`+
        `<div class="multi-lista">${pintarMultiLista(c,"")}</div>`+
      `</div>`+
    `</div></div>`).join("");

  document.getElementById("filtros").innerHTML =
    campos +
    `<div class="campo"><label for="f-busca">Buscar cliente</label>`+
    `<input id="f-busca" type="search" placeholder="nome do cliente…" value="${esc(est.busca)}"></div>`+
    `<label class="chk"><input type="checkbox" id="f-hist"${est.historico?" checked":""}>Incluir histórico (KAIO1 e PABLO)</label>`+
    `<button class="btn-limpar" id="f-limpar">Limpar tudo</button>`+
    `<div class="contagem"><b id="cont-n">0</b> operações no filtro</div>`+
    fichasAtivas();
}

/* Fichas embaixo dos filtros: mostram tudo que está marcado e permitem tirar
   item a item, sem reabrir a lista. */
function fichasAtivas(){
  const fs = [];
  CAMPOS.forEach(c => est[c.id].forEach(v => fs.push(
    `<span class="ficha">${c.rot}: <b>${esc(c.rotular ? c.rotular(v) : v)}</b>`+
    `<button type="button" data-tirar="${c.id}" data-val="${esc(v)}" title="Remover">×</button></span>`)));
  if(est.busca.trim()) fs.push(
    `<span class="ficha">Busca: <b>${esc(est.busca.trim())}</b>`+
    `<button type="button" data-tirar="busca" title="Remover">×</button></span>`);
  if(est.historico) fs.push(
    `<span class="ficha">Incluindo <b>histórico</b>`+
    `<button type="button" data-tirar="historico" title="Remover">×</button></span>`);
  return fs.length ? `<div class="fichas">${fs.join("")}</div>` : "";
}

/* Só o conteúdo, sem reconstruir a barra — assim a lista aberta não fecha
   a cada clique numa caixa. */
function pintarConteudo(){
  const ops = filtrar();
  const c = document.getElementById("cont-n");
  if(c) c.textContent = ops.length.toLocaleString("pt-BR");
  const aba = ABAS.find(a=>a.id===est.aba) || ABAS[0];
  document.getElementById("conteudo").innerHTML = aba.fn(ops);
  ajustarCabecalho();   // a tabela acabou de ser recriada: remede o topo dos titulos
  ligarDicasMensal();   // pontos do gráfico mensal recebem o tooltip
  try{ localStorage.setItem("bi-pjc-aba", est.aba); }catch(e){}
}

function pintar(){
  pintarAbas();
  pintarFiltros();
  pintarConteudo();
}

/* A linha de subtotais tem altura variavel (as vezes traz "9 sem valor" numa
   segunda linha). Fixar o topo dos titulos num valor chutado corta o texto,
   entao mede-se a altura real depois de renderizar. */
function ajustarCabecalho(){
  /* A barra de abas e sticky no topo (z-index alto) e passaria por cima do
     cabecalho da tabela. Por isso as duas linhas grudam LOGO ABAIXO dela, e
     nao em 0 — e a altura da barra e medida, nao chutada. */
  const nav = document.querySelector("nav.abas");
  const alturaNav = nav ? Math.round(nav.getBoundingClientRect().height) : 0;

  document.querySelectorAll(".rolagem.fixa").forEach(caixa => {
    const sub = caixa.querySelector("thead tr.subtotais");
    const tit = caixa.querySelector("thead tr.titulos");
    if(!tit) return;
    const aplicar = () => {
      let base = alturaNav;
      if(sub){
        const h = Math.round(sub.getBoundingClientRect().height);
        if(!h) return false;
        sub.querySelectorAll("th").forEach(th => { th.style.top = base + "px"; });
        base += h;
      }
      tit.querySelectorAll("th").forEach(th => { th.style.top = base + "px"; });
      return true;
    };
    if(!aplicar()) requestAnimationFrame(aplicar);
  });
}

/* Atualiza em volta de uma lista aberta, preservando-a. */
function atualizarEmTorno(campoId){
  CAMPOS.forEach(c => {
    const el = document.querySelector(`.multi[data-campo="${c.id}"]`);
    if(!el) return;
    el.querySelector(".multi-btn").innerHTML = rotuloBotao(c) + '<span class="cae">▼</span>';
    if(c.id !== campoId){   // a lista aberta não se redesenha sob o cursor
      const busca = el.querySelector(".multi-busca");
      el.querySelector(".multi-lista").innerHTML = pintarMultiLista(c, busca ? busca.value : "");
    }
  });
  const antigas = document.querySelector(".fichas");
  if(antigas) antigas.remove();
  document.getElementById("filtros").insertAdjacentHTML("beforeend", fichasAtivas());
  pintarConteudo();
}

/* ---------- eventos ---------- */
function fecharListas(exceto){
  document.querySelectorAll(".multi").forEach(m => {
    if(m === exceto) return;
    m.dataset.aberto = "0";
    m.querySelector(".multi-pop").classList.add("oculto");
  });
}

document.addEventListener("click", e => {
  if(e.target.closest("#btn-atualizar")){ iniciarAtualizacao(); return; }

  const b = e.target.closest("button[data-aba]");
  if(b){ est.aba = b.dataset.aba; est.pagina = 1; fecharListas(); pintarAbas(); pintarConteudo(); return; }

  const p = e.target.closest("button[data-pag]");
  if(p){ est.pagina += (p.dataset.pag==="prox"?1:-1); pintarConteudo(); return; }

  /* --- controles do gráfico mensal --- */
  const bs = e.target.closest(".gmensal .series button[data-serie]");
  if(bs){
    if(bs.dataset.serie === "meta") est.mensalMeta = !est.mensalMeta;
    else                            est.mensalReal = !est.mensalReal;
    bs.setAttribute("aria-pressed", bs.dataset.serie === "meta" ? est.mensalMeta : est.mensalReal);
    redesenharMensal(); return;
  }
  /* abre/fecha a lista de gerentes do gráfico */
  const bg = e.target.closest('.multi[data-campo="mensalGer"] .multi-btn');
  if(bg){
    bg.parentElement.querySelector(".multi-pop").classList.toggle("oculto");
    return;
  }
  const cg = e.target.closest('.multi[data-campo="mensalGer"] input[data-ger]');
  if(cg){
    /* o clique no checkbox não deve fechar a lista: redesenha só o gráfico */
    if(cg.checked) est.mensalGer.add(cg.dataset.ger);
    else           est.mensalGer.delete(cg.dataset.ger);
    redesenharMensal();   // a lista continua intacta e aberta
    return;
  }
  if(e.target.closest('.multi[data-campo="mensalGer"]')) return;   // clique dentro da lista

  const th = e.target.closest("th[data-ord]");
  if(th){
    const k = th.dataset.ord;
    if(est.ordCol===k) est.ordDir *= -1; else { est.ordCol = k; est.ordDir = -1; }
    est.pagina = 1; pintarConteudo(); return;
  }

  /* abrir/fechar uma lista */
  const btn = e.target.closest(".multi-btn");
  if(btn){
    const m = btn.closest(".multi");
    const abrindo = m.dataset.aberto !== "1";
    fecharListas(m);
    m.dataset.aberto = abrindo ? "1" : "0";
    m.querySelector(".multi-pop").classList.toggle("oculto", !abrindo);
    if(abrindo){
      const bu = m.querySelector(".multi-busca");
      bu.value = "";
      const c = CAMPOS.find(x=>x.id===m.dataset.campo);
      m.querySelector(".multi-lista").innerHTML = pintarMultiLista(c,"");
      bu.focus();
    }
    return;
  }

  /* marcar todos / limpar dentro de uma lista */
  const acao = e.target.closest("button[data-acao]");
  if(acao){
    const m = acao.closest(".multi");
    const c = CAMPOS.find(x=>x.id===m.dataset.campo);
    const bu = m.querySelector(".multi-busca");
    if(acao.dataset.acao === "nenhum"){
      est[c.id].clear();
    } else {
      const f = (bu.value||"").trim().toLowerCase();
      opcoesDe(c).forEach(([v]) => {
        if(!f || String(c.rotular?c.rotular(v):v).toLowerCase().includes(f)) est[c.id].add(v);
      });
    }
    est.pagina = 1;
    m.querySelector(".multi-lista").innerHTML = pintarMultiLista(c, bu.value);
    atualizarEmTorno(c.id);
    return;
  }

  /* tirar uma ficha */
  const ficha = e.target.closest("button[data-tirar]");
  if(ficha){
    const alvo = ficha.dataset.tirar;
    if(alvo === "busca"){ est.busca = ""; }
    else if(alvo === "historico"){ est.historico = false; }
    else { est[alvo].delete(ficha.dataset.val); }
    est.pagina = 1;
    pintar();
    return;
  }

  if(e.target.id === "f-limpar"){
    CAMPOS.forEach(c => est[c.id].clear());
    est.busca = ""; est.historico = false; est.pagina = 1;
    pintar(); return;
  }

  if(!e.target.closest(".multi-pop")) fecharListas();
});

document.addEventListener("change", e => {
  /* caixa de uma opção */
  const cx = e.target.closest(".multi-lista input[type=checkbox]");
  if(cx){
    const m = cx.closest(".multi");
    const c = CAMPOS.find(x=>x.id===m.dataset.campo);
    if(cx.checked) est[c.id].add(cx.value); else est[c.id].delete(cx.value);
    est.pagina = 1;
    atualizarEmTorno(c.id);
    return;
  }
  if(e.target.id === "f-hist"){
    est.historico = e.target.checked;
    est.pagina = 1;
    pintar();
  }
});

let deb, debL;
document.addEventListener("input", e => {
  /* busca dentro de uma lista */
  const bl = e.target.closest(".multi-busca");
  if(bl){
    clearTimeout(debL);
    const m = bl.closest(".multi");
    const c = CAMPOS.find(x=>x.id===m.dataset.campo);
    debL = setTimeout(() => {
      m.querySelector(".multi-lista").innerHTML = pintarMultiLista(c, bl.value);
    }, 120);
    return;
  }
  if(e.target.id !== "f-busca") return;
  clearTimeout(deb);
  const v = e.target.value;
  deb = setTimeout(() => {
    est.busca = v; est.pagina = 1;
    atualizarEmTorno(null);
    const c = document.getElementById("f-busca");
    if(c){ c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
  }, 260);
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape") fecharListas();
});

/* ---------- atualização (botão) ---------- */
let esAtu = null;   // conexão de eventos em andamento

const elModal   = document.getElementById("modal-atu");
const elBtn     = document.getElementById("btn-atualizar");

function iniciarAtualizacao(){
  /* Sem servidor local (aberto por file://) o navegador não deixa rodar
     scripts. Explico e ofereço a alternativa. */
  /* Aberto por file:// (modo sem servidor, usado pelos diretores): o navegador
     não deixa a página rodar programa nenhum. A atualização acontece no
     próprio atalho, então é só isso que precisa ser explicado. */
  if(location.protocol === "file:"){
    const D = window.DADOS_BI || {};
    const quando = (D.geradoEm||"").slice(0,16).replace("T"," ");
    modalAviso(
      "Para atualizar, feche e abra pelo atalho",
      'Estes dados são de <b>'+ (quando || "—") +'</b>.'+
      '<div style="margin:14px 0">Feche esta aba e dê duplo clique em '+
      '<b>“BI de Operações PJC”</b>. Ele busca a planilha mais recente, '+
      'recalcula tudo e reabre o painel já atualizado.</div>'+
      '<div class="aviso-atu">Leva alguns segundos. Não precisa instalar nada.</div>');
    return;
  }

  abrirModal();
  resetProgresso();
  elBtn.classList.add("girando");
  elBtn.disabled = true;

  /* Confere se o servidor está vivo ANTES de começar, para dar um aviso claro
     e imediato caso ele tenha caído (ex.: painel aberto do cache do navegador). */
  fetch("/ping", {cache:"no-store"})
    .then(r => { if(!r.ok) throw new Error("sem servidor"); conectarAtualizacao(); })
    .catch(() => {
      mostrarErro("O servidor local não respondeu. Feche esta aba e abra o painel de novo "+
                  "pelo atalho “BI de Operações PJC” — ele sobe o servidor sozinho.");
    });
}

function conectarAtualizacao(){
  esAtu = new EventSource("/atualizar");
  esAtu.onmessage = ev => {
    let d; try{ d = JSON.parse(ev.data); }catch(_){ return; }
    aplicarProgresso(d);
    if(d.pct >= 100){
      encerrarES();
      marcarBotaoPronto();
      setTimeout(() => location.reload(), 1400);
    } else if(d.pct < 0){
      encerrarES();
      mostrarErro(d.msg);
    }
  };
  esAtu.onerror = () => {
    encerrarES();
    mostrarErro("A conexão com o servidor caiu no meio da atualização. Feche esta aba e "+
                "abra o painel de novo pelo atalho “BI de Operações PJC”, depois tente outra vez.");
  };
}

function encerrarES(){
  if(esAtu){ esAtu.close(); esAtu = null; }
  elBtn.classList.remove("girando");
  elBtn.disabled = false;
}

function abrirModal(){ elModal.classList.remove("oculto"); }
function fecharModal(){
  if(esAtu){   // atualização ainda rodando: só esconde, sem interromper
    elModal.classList.add("oculto");
    return;
  }
  elModal.classList.add("oculto");
}

function resetProgresso(){
  document.getElementById("titulo-atu").textContent = "Atualizando o BI";
  document.getElementById("corpo-atu").style.display = "";
  document.getElementById("pct-atu").textContent = "0%";
  const p = document.getElementById("preench-atu");
  p.style.width = "0%"; p.className = "preench-atu";
  const m = document.getElementById("msg-atu");
  m.textContent = "Preparando…"; m.className = "msg-atu";
  document.getElementById("log-atu").innerHTML = "";
  document.querySelectorAll(".etapa-atu").forEach(e => e.removeAttribute("data-e"));
  document.getElementById("acoes-atu").innerHTML =
    `<button id="ocultar-atu">Continuar usando o painel</button>`;
}

function aplicarProgresso(d){
  const pct = Math.max(0, Math.min(100, d.pct));
  document.getElementById("pct-atu").textContent = pct + "%";
  document.getElementById("preench-atu").style.width = pct + "%";
  const m = document.getElementById("msg-atu");
  m.textContent = d.msg || ""; m.className = "msg-atu";
  logAtu(d.msg);

  /* etapas: download (1) e bi (2) */
  const e1 = document.querySelector('.etapa-atu[data-etapa="download"]');
  const e2 = document.querySelector('.etapa-atu[data-etapa="bi"]');
  if(d.etapa === "download"){ e1.dataset.e = "ativa"; }
  if(pct >= 50){ e1.dataset.e = "feita"; }
  if(d.etapa === "bi"){ e2.dataset.e = "ativa"; }
  if(d.etapa === "fim" || pct >= 100){ e1.dataset.e = "feita"; e2.dataset.e = "feita"; }
}

function logAtu(msg){
  if(!msg) return;
  const log = document.getElementById("log-atu");
  const linha = document.createElement("div");
  linha.textContent = "› " + msg;
  log.appendChild(linha);
  log.scrollTop = log.scrollHeight;
}

function marcarBotaoPronto(){
  document.getElementById("preench-atu").classList.add("ok");
  const m = document.getElementById("msg-atu");
  m.textContent = "Concluído! Recarregando o painel…";
  document.getElementById("acoes-atu").innerHTML = "";
}

function mostrarErro(msg){
  const p = document.getElementById("preench-atu");
  p.classList.add("erro");
  const m = document.getElementById("msg-atu");
  m.textContent = msg; m.className = "msg-atu erro";
  logAtu(msg);
  document.getElementById("acoes-atu").innerHTML =
    `<button id="fechar-atu">Fechar</button>`;
}

function modalAviso(titulo, corpoHtml){
  abrirModal();
  document.getElementById("titulo-atu").textContent = titulo;
  document.getElementById("corpo-atu").style.display = "none";
  document.getElementById("corpo-atu").insertAdjacentHTML("afterend",
    `<div class="aviso-atu" id="aviso-tmp">${corpoHtml}</div>`);
  document.getElementById("acoes-atu").innerHTML =
    `<button id="fechar-atu" class="primario">Entendi</button>`;
}

/* fechamentos do modal */
document.addEventListener("click", e => {
  if(e.target.closest("#fechar-atu") || e.target.closest("#ocultar-atu")){
    const tmp = document.getElementById("aviso-tmp");
    if(tmp) tmp.remove();
    fecharModal();
    return;
  }
  if(e.target === elModal && !esAtu){ fecharModal(); }
});

/* ---------- início ---------- */
(function(){
  const datas = OPS.map(o=>o.data).filter(Boolean).sort();
  document.getElementById("carimbo-data").textContent =
    (D.geradoEm||"").slice(0,10).split("-").reverse().join("/");
  document.getElementById("carimbo-linhas").textContent =
    `${OPS.length} operações · ${new Set(OPS.map(o=>o.gerente)).size} gerentes` +
    (datas.length ? ` · última mexida ${fmtData(datas[datas.length-1])}` : "");
  try{ const a = localStorage.getItem("bi-pjc-aba"); if(a && ABAS.some(x=>x.id===a)) est.aba = a; }catch(e){}
  pintar();
  /* Mudar a largura da janela pode quebrar o texto do subtotal em mais linhas
     e mudar a altura dele — remede antes que os titulos fiquem cortados. */
  window.addEventListener("resize", ajustarCabecalho);
})();

})();
