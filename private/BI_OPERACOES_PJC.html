<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- O painel e reaberto sempre pelo mesmo caminho de arquivo. Sem isto, o
     navegador reexibe a versao guardada e as melhorias parecem nao ter sido
     aplicadas. -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI de Operações — PJC</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='1' y='1' width='30' height='30' rx='7.5' fill='%230c1927'/><path d='M6.5 22 L13.5 15 L17.5 18 L25.5 9.5' fill='none' stroke='%23c9a24b' stroke-opacity='.45' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/><path d='M22 9 L25.8 9.3 L25.3 13' fill='none' stroke='%23c9a24b' stroke-opacity='.45' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/><text x='16' y='24' font-family='Georgia,serif' font-size='21' font-weight='700' text-anchor='middle' fill='%23e0bd6a'>$</text></svg>">
<style>
:root{
  --bg:#0a1017; --surface:#111e2b; --surface-2:#16283a; --surface-3:#1b3149;
  --gold:#c9a24b; --gold-dim:#8a6f34;
  --ink:#ffffff; --ink-2:#b8c4d0; --muted:#7d8b99;
  --grid:#1e2f42; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#008300; --s3:#d55181; --s4:#c98500;
  --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
  --f1:#cde2fb; --f2:#9ec5f4; --f3:#6da7ec; --f4:#3987e5; --f5:#256abf;
  --good:#0ca30c; --critical:#d03b3b; --warning:#fab219;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--s1)}

/* ---------- cabecalho ---------- */
header{position:relative;overflow:hidden;background:linear-gradient(160deg,#0d1a26,#0a1017 70%);border-bottom:1px solid var(--border)}
header .plexus{position:absolute;inset:0;opacity:.30;pointer-events:none}
header .wrap{position:relative;max-width:1520px;margin:0 auto;padding:22px 28px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
/* Marca oficial do Grupo PJC, embutida em base64 de proposito: o painel roda
   por file:// e precisa continuar sendo um arquivo unico, sem imagem ao lado. */
.wordmark{display:flex;align-items:center;flex:none}
.wordmark img{display:block;height:52px;width:auto}
.titulo{flex:1;min-width:220px}
.titulo h1{font-size:18px}
.titulo p{margin:3px 0 0;color:var(--muted);font-size:12px}
.carimbo{flex:none;text-align:right;font-size:11px;color:var(--muted);line-height:1.7}
.carimbo b{color:var(--ink-2);font-weight:600}
.btn-atualizar{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;
  background:linear-gradient(180deg,#d3ad57,#b98f3d);color:#0a1017;border:0;border-radius:8px;
  padding:9px 15px;font:700 12.5px var(--sans);cursor:pointer;box-shadow:0 2px 10px rgba(201,162,75,.28);
  transition:filter .15s,transform .05s}
.btn-atualizar:hover{filter:brightness(1.07)}
.btn-atualizar:active{transform:translateY(1px)}
.btn-atualizar svg{display:block}
/* Volta para a capa. Fica ao lado do "Atualizar dados" de proposito: os dois
   sao acoes do painel, nao conteudo, e sozinho no canto oposto o link some. */
.btn-menu{display:inline-flex;align-items:center;gap:7px;margin:0 8px 8px 0;
  background:transparent;color:var(--gold);border:1px solid var(--gold-dim);border-radius:8px;
  padding:8px 13px;font:600 12.5px var(--sans);cursor:pointer;text-decoration:none;
  transition:background .15s,border-color .15s,transform .05s}
.btn-menu:hover{background:rgba(201,162,75,.12);border-color:var(--gold)}
.btn-menu:active{transform:translateY(1px)}
.btn-menu svg{display:block}
.btn-atualizar.girando svg{animation:girar 1s linear infinite}
.btn-atualizar:disabled{opacity:.6;cursor:default}
@keyframes girar{to{transform:rotate(360deg)}}

/* ---------- modal de atualizacao ---------- */
.modal-atu{position:fixed;inset:0;z-index:120;display:grid;place-items:center;
  background:rgba(5,10,15,.74);backdrop-filter:blur(3px)}
.cartao-atu{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  width:min(540px,92vw);padding:26px 28px 22px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.cartao-atu h2{font-size:17px;display:flex;align-items:center;gap:11px;margin-bottom:4px}
.cartao-atu .sub-atu{font-size:12.5px;color:var(--muted);margin:0 0 20px}
.etapas-atu{display:flex;gap:10px;margin-bottom:18px}
.etapa-atu{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;display:flex;align-items:center;gap:10px}
.etapa-atu .bola{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--surface-3);color:var(--muted);border:1px solid var(--border)}
.etapa-atu .rot-atu{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.3}
.etapa-atu[data-e="ativa"]{border-color:var(--gold)}
.etapa-atu[data-e="ativa"] .bola{background:var(--gold);color:#0a1017;border-color:var(--gold);
  animation:pulsar 1.2s ease-in-out infinite}
.etapa-atu[data-e="ativa"] .rot-atu{color:var(--ink)}
.etapa-atu[data-e="feita"] .bola{background:var(--good);color:#0a1017;border-color:var(--good)}
.etapa-atu[data-e="feita"] .rot-atu{color:var(--ink)}
@keyframes pulsar{0%,100%{box-shadow:0 0 0 0 rgba(201,162,75,.5)}50%{box-shadow:0 0 0 6px rgba(201,162,75,0)}}

.pct-atu{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1;text-align:center;margin:6px 0 12px}
.barra-atu{height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.preench-atu{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#b98f3d,#e0c070);
  transition:width .4s cubic-bezier(.4,0,.2,1)}
.preench-atu.erro{background:linear-gradient(90deg,#b13636,#d03b3b)}
.preench-atu.ok{background:linear-gradient(90deg,#0a8a0a,#0ca30c)}
.msg-atu{font-size:13px;color:var(--ink-2);text-align:center;margin:14px 0 4px;min-height:20px}
.msg-atu.erro{color:var(--critical);font-weight:600}
.log-atu{max-height:132px;overflow-y:auto;background:#050a0f;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;margin-top:12px;font:11.5px/1.7 ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--muted)}
.log-atu div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-atu div:last-child{color:var(--ink-2)}
.log-atu::-webkit-scrollbar{width:8px}
.log-atu::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px}
.acoes-atu{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.acoes-atu button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:8px;padding:9px 18px;font:600 13px var(--sans);cursor:pointer}
.acoes-atu button:hover{border-color:var(--gold);color:var(--gold)}
.acoes-atu button.primario{background:var(--gold);color:#0a1017;border-color:var(--gold)}
.aviso-atu{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--warning);
  border-radius:8px;padding:13px 15px;font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-top:4px}
.aviso-atu code{background:#050a0f;padding:2px 7px;border-radius:5px;color:var(--gold);font-size:12px}

/* ---------- abas ---------- */
nav.abas{position:sticky;top:0;z-index:40;background:rgba(10,16,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
nav.abas .wrap{max-width:1520px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}
nav.abas button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:600 13px var(--sans);padding:13px 15px;cursor:pointer;white-space:nowrap;transition:color .15s}
nav.abas button:hover{color:var(--ink-2)}
nav.abas button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
nav.abas button .pino{display:inline-block;margin-left:6px;background:var(--warning);color:#111e2b;
  font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;vertical-align:1px}

main{max-width:1520px;margin:0 auto;padding:22px 28px 70px}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:140px}
.campo label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.campo select,.campo input{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;font:14px var(--sans);min-width:140px}
.campo select:focus,.campo input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;padding:8px 12px;cursor:pointer;user-select:none;font-size:13px}
.chk input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}

/* ---------- filtro de multipla escolha ---------- */
.multi{position:relative}
.multi-btn{width:100%;min-width:190px;display:flex;align-items:center;gap:8px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--border);border-radius:7px;
  padding:7px 10px;font:14px var(--sans);cursor:pointer;text-align:left}
.multi-btn:hover{border-color:var(--gold-dim)}
.multi-btn .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-btn .txt.todos{color:var(--muted)}
.multi-btn .cha{background:var(--gold);color:#0a1017;font-size:11px;font-weight:700;
  border-radius:9px;padding:1px 7px;flex:none}
.multi-btn .cae{color:var(--muted);font-size:10px;flex:none;transition:transform .15s}
.multi[data-aberto="1"] .multi-btn{border-color:var(--gold)}
.multi[data-aberto="1"] .cae{transform:rotate(180deg)}

.multi-pop{position:absolute;z-index:60;top:calc(100% + 5px);left:0;min-width:260px;max-width:340px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.6);overflow:hidden}
.multi-pop .topo{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.multi-pop .topo input{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--border);
  border-radius:6px;padding:6px 9px;font:13px var(--sans)}
.multi-pop .acoes{display:flex;gap:7px}
.multi-pop .acoes button{flex:1;background:none;border:1px solid var(--border);color:var(--ink-2);
  border-radius:6px;padding:5px 8px;font:600 11.5px var(--sans);cursor:pointer}
.multi-pop .acoes button:hover{border-color:var(--gold);color:var(--gold)}
.multi-lista{max-height:264px;overflow-y:auto;padding:5px}
.multi-lista label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;
  cursor:pointer;font-size:13px;user-select:none}
.multi-lista label:hover{background:var(--surface-3)}
.multi-lista input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer;flex:none}
.multi-lista .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.multi-lista .cnt{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.multi-lista .nada{color:var(--muted);font-size:12.5px;padding:14px 9px;text-align:center}
.multi-lista::-webkit-scrollbar{width:9px}
.multi-lista::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px}

.fichas{display:flex;gap:7px;flex-wrap:wrap;width:100%;margin-top:2px}
.ficha{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);
  border:1px solid var(--border);border-radius:14px;padding:3px 5px 3px 11px;font-size:11.5px;color:var(--ink-2)}
.ficha b{color:var(--ink);font-weight:600}
.ficha button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;
  line-height:1;padding:0 4px;border-radius:50%}
.ficha button:hover{color:var(--critical)}
.btn-limpar{background:none;border:1px solid var(--border);color:var(--ink-2);border-radius:7px;
  padding:8px 14px;font:600 13px var(--sans);cursor:pointer}
.btn-limpar:hover{border-color:var(--gold);color:var(--gold)}
.contagem{margin-left:auto;font-size:12px;color:var(--muted);padding-bottom:9px}
.contagem b{color:var(--ink);font-size:15px}

/* ---------- cartoes ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .val{font-size:29px;font-weight:600;letter-spacing:-.02em;margin:7px 0 2px;line-height:1.1;
  white-space:nowrap}
/* Valor por extenso fica longo (R$ 710.458.600). Em vez de deixar quebrar em
   duas linhas e desalinhar os cartoes, a fonte encolhe conforme o numero cresce. */
.kpi .val.medio{font-size:25px}
.kpi .val.longo{font-size:21px}
.kpi .pe{font-size:11.5px;color:var(--muted)}
.kpi.alerta::before{background:var(--warning)}
.kpi .val.vazio{color:var(--muted);font-size:19px;font-weight:500}

.painel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px 20px}
.painel > h2{font-size:14.5px;margin-bottom:3px}
.painel > .desc{font-size:12px;color:var(--muted);margin:0 0 16px}
.duas{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}

/* ---------- graficos ---------- */
.barras{display:flex;flex-direction:column;gap:9px}
.linha-b{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:12px;align-items:center}
.linha-b .rot{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trilha{background:var(--surface-2);border-radius:4px;height:26px;position:relative;overflow:hidden}
.barra{height:100%;border-radius:0 4px 4px 0;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:2px}
.linha-b .num{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;min-width:96px;font-weight:500}
.linha-b .num small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.linha-b:hover .rot{color:var(--ink)}

.legenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
.legenda span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.legenda i{width:11px;height:11px;border-radius:3px;flex:none}

/* funil */
.funil{display:flex;flex-direction:column;gap:5px}
.etapa{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  background:var(--surface-2);border-radius:8px;padding:11px 15px;position:relative;overflow:hidden}
.etapa .fundo{position:absolute;inset:0;opacity:.30;transition:width .35s}
.etapa .esq,.etapa .dir{position:relative}
.etapa .nome{font-size:13px;font-weight:600}
.etapa .qtd{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.etapa .dir{text-align:right;font-variant-numeric:tabular-nums}
.etapa .dir .v{font-size:16px;font-weight:600}
.etapa .dir .p{font-size:11px;color:var(--muted)}
.seta{text-align:center;color:var(--muted);font-size:11px;padding:1px 0}
.seta b{color:var(--ink-2)}

.desfechos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.desfecho{border-radius:10px;padding:14px 16px;border:1px solid var(--border);background:var(--surface-2)}
.desfecho .cab{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.desfecho .ico{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#0a1017;flex:none}
.desfecho .v{font-size:24px;font-weight:600;margin-top:9px;letter-spacing:-.02em}
.desfecho .p{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- tabelas ---------- */
.rolagem{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
/* Cabecalho fixo na tabela de operacoes.
   Sem caixa de rolagem propria de proposito: com overflow no container, o
   sticky passa a valer dentro dele, e quem rola a PAGINA (o caso comum, com o
   mouse fora da tabela) via o cabecalho subir junto. Deixando a rolagem ser a
   da janela, as duas linhas grudam no topo da tela. */
.rolagem.fixa{overflow:visible}
.rolagem.fixa thead th{position:sticky;z-index:2}
.rolagem.fixa tr.subtotais th{z-index:3;background:var(--surface-3);
  color:var(--ink);font-size:11px;text-transform:none;letter-spacing:0;
  border-bottom:1px solid var(--border);cursor:default}
.rolagem.fixa tr.subtotais th:hover{color:var(--ink)}
/* os dois "top" sao calculados em ajustarCabecalho(): dependem da altura da
   barra de abas, que e sticky por cima da tabela */
tr.subtotais .rot{color:var(--muted);font-weight:600;text-transform:uppercase;
  font-size:10px;letter-spacing:.07em}
tr.subtotais .val{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--surface-2);color:var(--ink-2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.07em;font-weight:600;text-align:left;padding:11px 13px;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--gold)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:10px 13px;border-top:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
td.forte{font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.vazio-cel{color:#5c6874}
.sem-dado{font-size:11.5px;color:var(--warning);font-style:italic}
.hist-mark{font-size:10px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}

.paginacao{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;font-size:12.5px;color:var(--muted)}
.paginacao button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);
  border-radius:7px;padding:6px 13px;font:600 12.5px var(--sans);cursor:pointer}
.paginacao button:disabled{opacity:.35;cursor:default}
.paginacao button:not(:disabled):hover{border-color:var(--gold);color:var(--gold)}

/* ---------- notas ---------- */
.nota{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warning);
  border-radius:10px;padding:17px 20px;margin-bottom:14px}
.nota.ok{border-left-color:var(--good)}
.nota.info{border-left-color:var(--s1)}
.nota h3{font-size:13.5px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.nota .selo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:2px 8px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.nota p{margin:0 0 9px;color:var(--ink-2);font-size:13px;line-height:1.65}
.nota p:last-child{margin-bottom:0}
.nota code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--gold)}
.nota ul{margin:0 0 9px;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.7}
.nota .tabelinha{margin:11px 0 4px;font-size:12.5px;width:auto}
.nota .tabelinha td,.nota .tabelinha th{padding:6px 13px 6px 0;border:0}
.nota .tabelinha th{background:none;position:static;padding-bottom:8px}

.vazio-aviso{text-align:center;color:var(--muted);padding:46px 20px;font-size:13px}
.oculto{display:none !important}

/* tooltip */
/* ---- gráfico mensal Receita x Meta ---- */
.gmensal{margin-top:6px}
.gmensal .ctrl{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin:0 0 14px}
/* Largura folgada para nome e sobrenome caberem na mesma linha. */
.gmensal .ctrl .campo{min-width:300px}
.gmensal .multi-lista .opc{white-space:nowrap}
/* joga os botoes de serie para a direita, longe da lista */
.gmensal .series{display:flex;gap:7px;margin-left:auto}
.gmensal .series button{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  padding:8px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.gmensal .series button[aria-pressed="true"]{color:var(--ink);border-color:var(--gold)}
.gmensal .series button .amostra{width:20px;height:0;border-top-width:2.5px;border-top-style:solid;display:inline-block}
.gmensal svg{display:block;width:100%;height:auto;overflow:visible}
.gmensal .eixo{stroke:var(--border);stroke-width:1}
.gmensal .grade{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.gmensal .rotEixo{fill:var(--muted);font-size:10.5px}
.gmensal .ponto{cursor:pointer}
.gmensal .legenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.gmensal .legenda i{display:inline-block;width:22px;border-top-width:2.5px;border-top-style:solid;
  vertical-align:middle;margin-right:6px}
#dica{position:fixed;z-index:100;pointer-events:none;background:#050a0f;border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.55;box-shadow:0 8px 26px rgba(0,0,0,.6);
  max-width:290px;opacity:0;transition:opacity .12s}
#dica b{color:var(--gold)}
#dica .l{color:var(--muted)}

@media (max-width:720px){
  header .wrap,nav.abas .wrap,main{padding-left:16px;padding-right:16px}
  .linha-b{grid-template-columns:minmax(88px,120px) 1fr auto}
  .desfechos{grid-template-columns:1fr}
  .carimbo{text-align:left}
  .wordmark img{height:40px}
}
</style>
